<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cloudflare.com"></script>
</head>
<body onload="brython()">

    <h1>Python Text Analyzer</h1>
    <input id="user-text" placeholder="Type a sentence here..." size="35">
    <button id="check-btn">Analyze Text</button>
    <p id="result"></p>

    <script type="text/python">
        from browser import document

        def analyze(event):
            text = document["user-text"].value.strip()
            if not text:
                document["result"].text = "Please type something first!"
                return
            
            word_count = len(text.split())
            char_count = len(text)
            document["result"].text = f"Words: {word_count} | Characters: {char_count}"

        document["check-btn"].bind("click", analyze)
    </script>

</body>
</html>
