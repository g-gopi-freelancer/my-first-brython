<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://jsdelivr.net"></script>
</head>
<body onload="brython()">

    <h1 id="message">Click the button below!</h1>
    <button id="my-btn">Click Me</button>

    <script type="text/python">
        from browser import document

        count = 0

        def button_clicked(event):
            global count
            count += 1
            document["message"].text = f"You clicked the Python button {count} times!"

        document["my-btn"].bind("click", button_clicked)
    </script>

</body>
</html>
